version: "3.8"

services:
  db:
    image: postgres:15
    # Development placeholder credentials for the local Docker database only.
    # Do not use them for any shared or production database.
    environment:
      POSTGRES_USER: kwadwo
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: nlpdb
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: .
    ports:
      - "8002:8000"
    environment:
      DATABASE_URL: postgresql+psycopg2://kwadwo:password123@db/nlpdb
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env (see .env.example)}
    depends_on:
      - db

volumes:
  postgres_data: